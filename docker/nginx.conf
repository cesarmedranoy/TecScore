# nginx.conf — balanceo de carga entre instancias de Next.js
#
# Estrategia: least_conn (menos conexiones activas)
# Ideal para apps con requests de distinta duración como TecScore
# donde algunos endpoints (scoring, notifs) tardan más que otros.

upstream tecscore_app {
    least_conn;

    server app1:3000;
    server app2:3000;
    server app3:3000;

    # Keepalive: reutiliza conexiones TCP hacia los servidores
    # Reduce latencia en requests frecuentes (polling del chat, notifs)
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Tamaño máximo de body (para upload de avatares custom)
    client_max_body_size 5M;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # Headers para que Next.js sepa la IP real del cliente
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Archivos estáticos de Next.js — cache agresivo
    location /_next/static/ {
        proxy_pass http://tecscore_app;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Resto de requests → balancear entre instancias
    location / {
        proxy_pass http://tecscore_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Health check endpoint para monitoreo
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}