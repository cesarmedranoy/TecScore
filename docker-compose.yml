# docker-compose.yml — TecScore con escalamiento horizontal
#
# Arquitectura:
#   nginx (puerto 80) → load balancer
#       ├── app1 (Next.js :3000)
#       ├── app2 (Next.js :3000)
#       └── app3 (Next.js :3000)
#   dynamodb-local (puerto 8000) — BD compartida entre instancias
#   dynamodb-admin (puerto 8001) — UI de administración de tablas
#
# Uso:
#   npm run db:up          # solo DynamoDB (desarrollo)
#   docker compose up -d --build  # stack completo con nginx + 3 instancias

services:

  # ── Base de datos ────────────────────────────────────────────────────────────
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: tecscore-dynamodb
    ports:
      - "8000:8000"
    command: -jar DynamoDBLocal.jar -sharedDb -dbPath /data
    volumes:
      - ./docker/dynamodb-data:/data
    working_dir: /home/dynamodblocal
    user: root
    healthcheck:
      test: ["CMD-SHELL", "echo 'ok'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - tecscore-net

  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:latest
    container_name: tecscore-dynamodb-admin
    ports:
      - "8001:8001"
    environment:
      DYNAMO_ENDPOINT: http://dynamodb-local:8000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    depends_on:
      - dynamodb-local
    networks:
      - tecscore-net

  # ── Aplicación Next.js (3 instancias para balanceo) ──────────────────────────
  app1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tecscore-app1
    env_file: .env.local
    environment:
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - INSTANCE_ID=app1
    depends_on:
      - dynamodb-local
    networks:
      - tecscore-net
    restart: unless-stopped

  app2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tecscore-app2
    env_file: .env.local
    environment:
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - INSTANCE_ID=app2
    depends_on:
      - dynamodb-local
    networks:
      - tecscore-net
    restart: unless-stopped

  app3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tecscore-app3
    env_file: .env.local
    environment:
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - INSTANCE_ID=app3
    depends_on:
      - dynamodb-local
    networks:
      - tecscore-net
    restart: unless-stopped

  # ── Load Balancer ─────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: tecscore-nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app1
      - app2
      - app3
    networks:
      - tecscore-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  tecscore-net:
    driver: bridge